apiVersion: v1
kind: Secret
metadata:
  name: django-secrets
  namespace: django-ninja
type: Opaque
stringData:
  # IMPORTANT: Replace these values before deploying!
  # Generate a secret key: openssl rand -base64 50
  SECRET_KEY: "CHANGE_ME"
  DB_PASSWORD: "CHANGE_ME"
  REDIS_PASSWORD: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: flower-secrets
  namespace: django-ninja
type: Opaque
stringData:
  # Format: user:password
  FLOWER_BASIC_AUTH: "CHANGE_ME"
