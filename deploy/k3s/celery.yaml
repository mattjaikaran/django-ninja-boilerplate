apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-worker
  namespace: django-ninja
  labels:
    app: celery
    component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery
      component: worker
  template:
    metadata:
      labels:
        app: celery
        component: worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: celery-worker
          image: your-registry/django-ninja-stack:latest
          command:
            - celery
            - -A
            - api
            - worker
            - -l
            - info
            - --concurrency
            - "2"
          envFrom:
            - configMapRef:
                name: django-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: SECRET_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: CELERY_BROKER_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: CELERY_RESULT_BACKEND
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/1"
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - api
                - inspect
                - ping
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: django-ninja
  labels:
    app: celery
    component: beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: celery
      component: beat
  template:
    metadata:
      labels:
        app: celery
        component: beat
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: celery-beat
          image: your-registry/django-ninja-stack:latest
          command:
            - celery
            - -A
            - api
            - beat
            - -l
            - info
            - --scheduler
            - django_celery_beat.schedulers:DatabaseScheduler
          envFrom:
            - configMapRef:
                name: django-config
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: SECRET_KEY
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: django-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: CELERY_BROKER_URL
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/0"
            - name: CELERY_RESULT_BACKEND
              value: "redis://:$(REDIS_PASSWORD)@redis:6379/1"
          resources:
            limits:
              cpu: 200m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 128Mi
