# Railway Configuration
# https://docs.railway.app/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/docker/Dockerfile.single"

[deploy]
numReplicas = 1
healthcheckPath = "/api/health/"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# Environment variables (set in Railway dashboard or via CLI)
# Required:
#   - SECRET_KEY
#   - DATABASE_URL (auto-provided by Railway PostgreSQL)
#   - VALKEY_URL (use Railway Valkey template: https://railway.com/deploy/valkey-1)
#   - REDIS_URL (fallback alias for VALKEY_URL)
#   - ALLOWED_HOSTS
