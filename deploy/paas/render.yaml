# Render Blueprint Specification
# https://render.com/docs/blueprint-spec
#
# Deploy with: render blueprint apply

services:
  # Django Backend
  - type: web
    name: django-api
    runtime: docker
    dockerfilePath: ./deploy/docker/Dockerfile.single
    dockerContext: .
    plan: starter
    healthCheckPath: /api/health/
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: redis
          property: connectionString
      - key: DJANGO_SETTINGS_MODULE
        value: api.settings

databases:
  - name: postgres
    plan: starter
    databaseName: boilerplate_db
    user: postgres
    ipAllowList: []  # Allow only internal connections

  - name: redis
    plan: starter
    ipAllowList: []  # Allow only internal connections
