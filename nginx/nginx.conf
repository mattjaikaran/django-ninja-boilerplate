# Both upstreams resolve per request through Docker's DNS. A static
# `upstream` block pins the container IP at nginx startup, so recreating
# django-prod (for example `up -d --build` during a deploy) left nginx sending
# traffic to the old address and returning 502 until nginx restarted.
# Centrifugo ships under the `realtime-prod` profile; per-request resolution
# also lets nginx start when that profile is not enabled.
resolver 127.0.0.11 valid=10s ipv6=off;

# Scheme the browser used. The outer TLS proxy in front of this nginx sets
# X-Forwarded-Proto: https; without it, nginx reports its own scheme (http).
# Django trusts this header only with USE_TLS=true, which production requires.
# Expose port 80 only to that TLS proxy, never to the internet.
map $http_x_forwarded_proto $client_scheme {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name localhost;

    # Security headers. Django owns Content-Security-Policy (CSP_DIRECTIVES in
    # api/settings), so nginx does not send a second, conflicting policy.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Static files — the shared `static_volume` is mounted at /app/staticfiles
    # in both the django and nginx containers.
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Media files are user uploads served on the API and admin origin. An
    # `add_header` here drops the server-level headers, so restate nosniff and
    # sandbox every response: an uploaded HTML or SVG file must not run script
    # with this origin's cookies.
    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; style-src 'unsafe-inline'; sandbox" always;
    }

    # API-only backend: Django serves /api/ and the admin (ADMIN_URL, default
    # admin/). When you change ADMIN_URL, replace `admin` in this regex with
    # the new path. The frontend is a separate container or origin
    # (docs/COOKIE_AUTH.md).
    location ~ ^/(api|admin)/ {
        set $django_upstream http://django-prod:8000;
        proxy_pass $django_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_redirect off;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Server-Sent Events: stream unbuffered and keep idle streams open.
    location = /api/events/stream/ {
        set $django_upstream http://django-prod:8000;
        proxy_pass $django_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $client_scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Nothing else is served here.
    location / {
        return 404;
    }

    # Centrifugo: expose only the client WebSocket endpoint. The server API
    # (/api), admin UI, health and every other Centrifugo path stay on the
    # internal network (`location /` returns 404); Django reaches the API at
    # http://centrifugo-prod:8000.
    location = /centrifugo/connection/websocket {
        set $centrifugo_upstream http://centrifugo-prod:8000;
        rewrite ^/centrifugo/(.*)$ /$1 break;
        proxy_pass $centrifugo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Block access to sensitive files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}
