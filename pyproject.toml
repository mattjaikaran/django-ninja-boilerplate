[project]
name = "django-ninja-boilerplate"
version = "1.2.0"
description = "A production-ready Django boilerplate using Django Ninja for building modern APIs"
authors = [{ name = "Matt Jaikaran", email = "info@mattjaikaran.com" }]
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.13"
keywords = ["django", "ninja", "api", "boilerplate"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

dependencies = [
    # Core Django (5.2 LTS default; 6.0 tested, blocked by django-celery-beat<6.0 cap)
    "Django>=5.2,<7.0",
    "django-environ>=0.11.2",
    "psycopg2-binary>=2.9.10",
    # Django Extensions
    "django-cors-headers>=4.6.0",
    "django-debug-toolbar>=4.4.6",
    "django-flags>=5.0.13",
    "django-import-export>=4.3.1",
    "django-js-asset>=2.2.0",
    "django-storages>=1.14.4",
    "django-unfold>=0.43.0",
    "django-redis>=5.4.0",
    # API Framework
    "django-ninja>=1.5.3",
    "django-ninja-extra>=0.30.8",
    "django-ninja-jwt>=5.4.0",
    # Task Queue (Celery)
    "celery>=5.4.0",
    "django-celery-beat>=2.6.0",
    "redis>=5.0.0",
    "flower>=2.0.0",
    # Authentication & Security
    "bcrypt>=4.2.1",
    "cryptography>=43.0.1",
    "PyJWT>=2.9.0",
    "python-jose>=3.3.0",
    "passlib>=1.7.4",
    # Email (Resend via Anymail)
    "django-anymail[resend]>=14.0",
    # HTTP & API
    "httpx>=0.27.0",
    "httpcore>=1.0.5",
    "requests>=2.32.3",
    "uvicorn>=0.24.0",
    "uvloop>=0.19.0",
    "gunicorn>=21.0.0",
    # AWS S3 Storage
    "boto3>=1.34.0",
    # Data Validation & Serialization
    "pydantic>=2.5.2",
    "pydantic-core>=2.14.5",
    "email-validator>=2.1.1",
    "orjson>=3.10.4",
    # File Processing
    "Pillow>=10.4.0",
    # Utilities
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.6",
    "click>=8.1.7",
    "rich>=13.7.1",
    # Template & Markup
    "Jinja2>=3.1.4",
    "MarkupSafe>=2.1.5",
    # OpenAPI Tools
    "openapi-spec-validator>=0.7.0",
    # System & Low-level
    "asgiref>=3.8.1",
    "anyio>=3.7.1",
    "certifi>=2024.7.4",
    "charset-normalizer>=3.3.2",
    "idna>=3.8",
    "urllib3>=2.2.2",
    "dnspython>=2.6.1",
    "attrs>=24.3.0",
    "typing-extensions>=4.8.0",
    "sqlparse>=0.5.3",
    "psutil>=7.2.1",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.0.0",
    "pytest-django>=4.8.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.12.0",
    "factory-boy>=3.3.0",
    "Faker>=30.1.0",
    "pre-commit>=4.0.0",
]
testing = [
    # Load testing
    "locust>=2.20.0",
    # Contract testing
    "schemathesis>=3.25.0",
    # HTTP client for contract tests
    "httpx>=0.27.0",
]
graphql = [
    "strawberry-graphql[django]>=0.220.0",
]
observability = [
    # OpenTelemetry - Distributed Tracing
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "opentelemetry-instrumentation-django>=0.41b0",
    "opentelemetry-instrumentation-requests>=0.41b0",
    "opentelemetry-instrumentation-psycopg2>=0.41b0",
    "opentelemetry-instrumentation-redis>=0.41b0",
    "opentelemetry-instrumentation-celery>=0.41b0",
    # Prometheus metrics (optional - we have a pure Python implementation)
    "prometheus-client>=0.19.0",
    # Structured JSON logging
    "python-json-logger>=2.0.7",
]

[project.urls]
homepage = "https://github.com/mattjaikaran/django-ninja-boilerplate"
repository = "https://github.com/mattjaikaran/django-ninja-boilerplate"
documentation = "https://github.com/mattjaikaran/django-ninja-boilerplate#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "core", "todos"]

[tool.ruff]
target-version = "py313"
line-length = 88
fix = true
show-fixes = true
output-format = "grouped"

[tool.ruff.lint]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
# Also enable isort (`I`), pydocstyle (`D`), and other useful rules
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "UP",   # pyupgrade
    "YTT",  # flake8-2020
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "COM",  # flake8-commas
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "T10",  # flake8-debugger
    "DJ",   # flake8-django
    "EM",   # flake8-errmsg
    "EXE",  # flake8-executable
    "FA",   # flake8-future-annotations
    "ISC",  # flake8-implicit-str-concat
    "ICN",  # flake8-import-conventions
    "G",    # flake8-logging-format
    "INP",  # flake8-no-pep420
    "PIE",  # flake8-pie
    "T20",  # flake8-print
    "PYI",  # flake8-pyi
    "PT",   # flake8-pytest-style
    "Q",    # flake8-quotes
    "RSE",  # flake8-raise
    "RET",  # flake8-return
    "SLF",  # flake8-self
    "SLOT", # flake8-slots
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "TCH",  # flake8-type-checking
    "INT",  # flake8-gettext
    "ARG",  # flake8-unused-arguments
    "PTH",  # flake8-use-pathlib
    "ERA",  # eradicate
    "PD",   # pandas-vet
    "PGH",  # pygrep-hooks
    "PL",   # Pylint
    "TRY",  # tryceratops
    "FLY",  # flynt
    "NPY",  # NumPy-specific rules
    "PERF", # Perflint
    "FURB", # refurb
    "LOG",  # flake8-logging
    "RUF",  # Ruff-specific rules
]

ignore = [
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D103",    # Missing docstring in public function
    "D104",    # Missing docstring in public package
    "D105",    # Missing docstring in magic method
    "D106",    # Missing docstring in public nested class
    "D107",    # Missing docstring in __init__
    "E501",    # Line too long (handled by formatter)
    "COM812",  # Trailing comma missing (handled by formatter)
    "ISC001",  # Implicitly concatenated string literals (conflicts with formatter)
    "DJ001",   # Avoid using `null=True` on string-based fields
    "DJ012",   # Order of model's inner classes, methods, and fields
    "TRY003",  # Avoid specifying long messages outside the exception class
    "PLR0913", # Too many arguments to function call
    "RUF012",  # Mutable class attributes should be annotated with `typing.ClassVar`
    "EXE001",  # Shebang is present but file is not executable
    "T201",    # `print` found
    "EM101",   # Exception must not use a string literal, assign to variable first
    "EM102",   # Exception must not use an f-string literal
    "ERA001",  # Found commented-out code (too noisy for boilerplate examples)
    "PLR2004", # Magic value used in comparison
    "PLC0415", # Import should be at top-level (sometimes needed for lazy loading)
    "TRY300",  # Consider moving statement to else block
    "TRY400",  # Use logging.exception instead of logging.error
    "TRY401",  # Redundant exception object in logging.exception
    "ARG001",  # Unused function argument (often needed for interface compliance)
    "ARG002",  # Unused method argument (often needed for interface compliance)
    "SLF001",  # Private member accessed (sometimes needed for Django internals)
    "PTH118",  # os.path.join should use Path (Django settings compatibility)
    "PTH123",  # open() should use Path.open() (low priority)
    "RET504",  # Unnecessary assignment before return
    "PLR0911", # Too many return statements
    "PLR0912", # Too many branches
    "PLR0915", # Too many statements
    "PLW2901", # For loop variable overwritten
    "SIM102",  # Use single if instead of nested
    "TC002",   # Move import into type-checking block
    "TC003",   # Move import into type-checking block
    "RUF013",  # PEP 484 prohibits implicit Optional
    "DTZ005",  # datetime.now() without tz (handled by Django settings)
    "DTZ007",  # Naive datetime strptime
    "UP046",   # Generic class uses Generic subclass
    "F841",    # Local variable assigned but never used
    "B904",    # Raise from err (too strict for CLI error handling)
    "UP042",   # StrEnum pattern is valid Python
    "D205",    # Blank line between summary and description
    "D415",    # First line punctuation
    "RUF022",  # __all__ sorting
    "PTH110",  # os.path.exists compatibility
    "E402",    # Module level import not at top (sometimes needed)
    "INP001",  # Implicit namespace package
    "G004",    # Logging statement uses f-string (acceptable in generators)
    "E722",    # Bare except (sometimes needed for generic error handling)
    "A002",    # Argument shadowing builtin (common with 'id')
    "F821",    # Undefined name (false positives with type annotations)
    "RUF059",  # Unused unpacked variable
    "PERF401", # List comprehension preference
    "SIM105",  # contextlib.suppress preference
    "PTH103",  # os.makedirs vs Path.mkdir
    "PTH107",  # os.remove vs Path.unlink
    "PTH109",  # os.getcwd vs Path.cwd
    "PTH120",  # os.path.dirname vs Path.parent
    "UP022",   # capture_output preference
    "TRY301",  # Abstract raise
    "DTZ006",  # datetime.fromtimestamp without tz
    "W293",    # Blank line whitespace
    "PLW0603", # Global statement (needed for singleton patterns)
]

[tool.ruff.lint.per-file-ignores]
"*/migrations/*" = ["E501", "D", "RUF012", "RUF001"]
"*/tests/*" = ["D", "S101", "TID252", "F841", "PT011", "F403", "F405"]
"*/test_*.py" = ["D", "S101", "TID252", "F841", "PT011"]
"*/tests/__init__.py" = ["F403", "F401"]
"conftest.py" = ["D", "F841"]
"*/conftest.py" = ["D", "F841"]
"manage.py" = ["D", "INP001"]
"*/settings.py" = ["F405", "F403"]
"*/settings/*.py" = ["F405", "F403"]
"scripts/*" = ["D", "INP001"]
"*/generators/*" = ["D"]
"*/templates/*" = ["D", "E501"]
"*/commands/*" = ["D", "F841"]
"*/schemas/*" = ["D"]
"*/schemas.py" = ["D"]
"cli/**/*.py" = ["B904", "UP042", "SIM102", "B008"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["api", "core", "todos"]
known-third-party = ["django"]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"

# ===========================================
# File Length Checker (scripts/check_file_length.py)
# ===========================================
[tool.file-length]
max-lines = 400
exclude = [
    "*/migrations/*",
    "*/management/commands/generators/*",
    "*/management/commands/generators/templates/*",
]

[tool.file-length.per-file-max]
"scripts/*" = 1200
"cli/*" = 800
"tests/*" = 600
"*/management/commands/*.py" = 800
"api/settings/common.py" = 600
"api/decorators.py" = 500
"*/services/*.py" = 700
"*/tasks/*.py" = 600
"*/audit/*.py" = 600
"*/observability/*.py" = 600
"*/features/*.py" = 700

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "api.settings.test"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    "--tb=short",
    "--cov=.",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=25",
]
testpaths = ["core", "todos"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::RuntimeWarning",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "contract: marks tests as API contract tests",
    "e2e: marks tests as end-to-end tests",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/migrations/*",
    "*/venv/*",
    "*/env/*",
    "manage.py",
    "*/settings.py",
    "*/test*",
    "*/__pycache__/*",
    "*/static/*",
    "*/media/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
