[project]
name = "create-django-ninja-stack"
version = "0.9.0"
description = "CLI tool for scaffolding Django Ninja Stack projects"
authors = [{ name = "Matt Jaikaran", email = "info@mattjaikaran.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["django", "ninja", "cli", "scaffolding", "boilerplate"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "jinja2>=3.1.0",
    "pyyaml>=6.0.0",
    "gitpython>=3.1.0",
    "questionary>=2.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.7.0",
]

[project.scripts]
create-django-ninja-stack = "create_django_ninja_stack.cli:app"
cdns = "create_django_ninja_stack.cli:app"

[project.urls]
homepage = "https://github.com/mattjaikaran/django-ninja-boilerplate"
repository = "https://github.com/mattjaikaran/django-ninja-boilerplate"
documentation = "https://github.com/mattjaikaran/django-ninja-boilerplate#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/create_django_ninja_stack"]

[tool.ruff]
target-version = "py311"
line-length = 88
fix = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-v", "--tb=short"]
