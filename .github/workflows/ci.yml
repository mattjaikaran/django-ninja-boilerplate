name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.13"
  UV_VERSION: "0.6.0"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Lock-respecting install so CI matches the committed uv.lock.
      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff formatter check
        run: uv run ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }}, Django ${{ matrix.django-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 3.14 stays out until pydantic-core publishes cp314 wheels: without them
      # the install builds it from source and fails on a runner with no Rust.
      # 6.1 is absent because django-celery-beat caps Django at <6.1 and
      # CELERY_BEAT_SCHEDULER depends on it, so it is not a supported install.
      # See DEPENDENCIES.md for the measured 6.1 result.
      matrix:
        python-version: ["3.13"]
        django-version: ["5.2", "6.0"]

    services:
      postgres:
        # pgvector build: the decisions migration creates the `vector`
        # extension, which the plain alpine image does not ship.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "1"
      SECRET_KEY: "test-secret-key-for-ci"
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: api.settings.test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies with Django ${{ matrix.django-version }}
        run: |
          # Lock-respecting install, then pin the matrix Django version.
          uv sync --locked --extra dev
          uv pip install --python .venv/bin/python "Django~=${{ matrix.django-version }}.0"
          # --no-sync on every later step too, or uv re-syncs the lock's
          # Django back over the matrix version.
          uv run --no-sync python -c "import django; print('Django', django.get_version())"

      - name: Run migrations
        run: |
          # --no-sync: the matrix Django version was pinned into this venv
          # above, and a plain `uv run` would re-sync it back to the lock.
          uv run --no-sync python manage.py migrate --noinput

      - name: Run tests with coverage
        run: uv run --no-sync pytest --timeout=60

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.13' && matrix.django-version == '5.2'
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image (production target)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          push: false
          tags: django-ninja-boilerplate:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image (development target)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: development
          push: false
          tags: django-ninja-boilerplate:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Docker image (ci target)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ci
          push: false
          tags: django-ninja-boilerplate:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run bandit security scan
        run: uv run bandit -c pyproject.toml -r .

      # Non-blocking: reports advisories without failing the build.
      - name: Run pip-audit
        run: uv run pip-audit || true

  gauntlet:
    name: Gauntlet (Quality Gate)
    runs-on: ubuntu-latest
    needs: [lint, test]

    services:
      postgres:
        # pgvector build: the decisions migration creates the `vector`
        # extension, which the plain alpine image does not ship.
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DEBUG: "1"
      SECRET_KEY: "gauntlet-ci-key-not-for-production"
      DB_NAME: test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SETTINGS_MODULE: api.settings.test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          uv sync --extra dev

      - name: Run migrations
        run: uv run python manage.py migrate --noinput

      - name: Run Architecture Check
        run: uv run python scripts/check_architecture.py --all

      - name: Run File Length Check
        run: |
          find . -name "*.py" -not -path "./.venv/*" -not -path "./env/*" | xargs uv run python scripts/check_file_length.py

      - name: Run Gauntlet (CI mode)
        run: uv run python scripts/gauntlet.py --ci --report

      - name: Upload Gauntlet Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gauntlet-report
          path: gauntlet-report.json

  cli-test:
    name: CLI Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CLI
        run: |
          cd cli
          uv pip install --system -e ".[dev]"

      - name: Test CLI help
        run: |
          django-ninja-matt --help

      - name: Test CLI version
        run: |
          django-ninja-matt --version

      - name: Test CLI init (dry run check)
        run: |
          django-ninja-matt init --help
