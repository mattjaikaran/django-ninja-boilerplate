name: Release

on:
  push:
    tags:
      - "v*"

env:
  PYTHON_VERSION: "3.13"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Release notes from CHANGELOG.md
        id: changelog
        env:
          VERSION: ${{ steps.get_version.outputs.VERSION }}
          BLOB: https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}
        run: |
          # The release body is the version's CHANGELOG.md section, not a
          # commit list. Relative links point at the tagged files.
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { f = 1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md | sed -E "s#\]\((docs/|UPGRADING\.md|FEATURE_GENERATION\.md)#](${BLOB}/\1#g")
          if [ -z "$NOTES" ]; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi
          {
            echo "NOTES<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.get_version.outputs.VERSION }}
          body: |
            ${{ steps.changelog.outputs.NOTES }}

            ## Installation

            ```bash
            git clone https://github.com/mattjaikaran/django-ninja-boilerplate.git
            cd django-ninja-boilerplate
            brew install just   # or: cargo install just
            just setup
            ```

            ## CLI Installation

            ```bash
            pipx install create-django-ninja-stack
            ```
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}

  publish-cli:
    name: Publish CLI to PyPI
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          uv pip install --system build twine

      - name: Build CLI package
        run: |
          cd cli
          python -m build

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          cd cli
          twine upload dist/*
        continue-on-error: true # Don't fail if PyPI token not configured
