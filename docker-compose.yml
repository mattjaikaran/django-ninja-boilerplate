# Django Ninja Boilerplate - Docker Compose Configuration
# Optimized for OrbStack and resource efficiency
#
# This configuration uses the unified multi-stage Dockerfile:
#   - Django service uses 'development' target for hot reload and debug tools
#   - Celery services use 'production' target for optimized performance
#
# Profiles:
#   dev        db, valkey, django
#   test       db, valkey only (run pytest from the host)
#   prod       db-prod, valkey-prod, django-prod, celery-worker-prod,
#              celery-beat-prod, nginx
#   single     db-single, redis, app (single-container PaaS)
#   celery     Celery workers for the dev stack
#   huey       Huey worker for the dev stack
#   django-q   django-q2 worker for the dev stack
#   django-rq  django-rq worker for the dev stack
#   dramatiq   Dramatiq worker for the dev stack
#   realtime   Dev Centrifugo real-time server
#   realtime-prod  Production Centrifugo real-time server
#   monitoring Flower + Jaeger
#   observability  Jaeger traces only
#   mail       Mailhog email capture
#   mcp        Development MCP server
#   decisions-clm  Optional GPU-backed Qwen3-8B encoder and CLM API
#
# Production services carry a -prod suffix because Docker Compose allows only
# one definition per service name, and the dev and production variants differ
# (build target, command, volume mounts).
#
# Usage:
#   just dev            - Start the dev stack
#   `just dev` activates the task profile selected by TASK_BACKEND.
#   Mailhog and MCP remain opt-in through `just up-mail` and `just up-mcp`.
#   docker compose --profile prod up -d
#   docker compose --profile single up -d

# Every application service reads the same .env the developer edits. Compose
# does not pass .env to services on its own, so without this most settings are
# silently ignored inside the containers. `required: false` keeps
# `docker compose config` working before .env exists. A service's own
# `environment:` entries still win, which is how the compose service names
# stay pinned for container-to-container traffic.
x-app-env: &app-env
  env_file:
    - path: .env
      required: false

services:
  # ===========================================
  # Core Services (always started)
  # ===========================================

  # PostgreSQL 17 Database
  db:
    # pgvector build: ships the `vector` extension used by the decisions app.
    image: pgvector/pgvector:pg17
    profiles:
      - dev
      - test
      - celery
      - huey
      - django-q
      - django-rq
      - dramatiq
      - mcp
    volumes:
      # Dev owns postgres_dev_data. db-prod and db-single keep postgres_data,
      # so a local prod run never opens or migrates the dev database.
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/dumps:/dumps
    environment:
      - POSTGRES_DB=${DB_NAME:-boilerplate_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      # Performance tuning for development
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # Valkey for caching and sessions
  valkey:
    image: valkey/valkey:8-alpine
    profiles:
      - dev
      - test
      - celery
      - huey
      - django-q
      - django-rq
      - dramatiq
      - realtime
      - monitoring
      - mcp
    ports:
      - "${VALKEY_PORT:-6380}:6379"
    volumes:
      - valkey_dev_data:/data
    command: >
      valkey-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # Django Web Application with Hot Reloading
  # Uses 'development' target for dev dependencies, debug tools, and hot reload
  django:
    <<: *app-env
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    entrypoint: ["/usr/local/bin/docker-entrypoint-dev.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # Exclude directories that don't need syncing for better performance
      - /app/.venv
      - /app/__pycache__
      - /app/.pytest_cache
      - /app/.ruff_cache
    ports:
      - "${DJANGO_PORT:-8000}:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-api.settings}
      - DEBUG=${DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DB_NAME=${DB_NAME:-boilerplate_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - VALKEY_URL=valkey://valkey:6379/0
      - REDIS_URL=valkey://valkey:6379/0
      # Celery broker/result backend: kombu has no "valkey" transport,
      # so use the redis scheme against the Valkey server (wire-compatible)
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - TASK_BACKEND=${TASK_BACKEND:-celery}
      # The host uses localhost; containers use the CLM service on the shared network.
      - CLM_BASE_URL=${CLM_CONTAINER_URL:-http://clm-api:8700}
      - CLM_API_KEY=${CLM_API_KEY:-}
      # Fixture similarity search (`embeddings` profile).
      - DECISION_EMBEDDING_URL=${DECISION_EMBEDDING_CONTAINER_URL:-http://embedder:8080/v1/embeddings}
      - CELERY_RESULT_BACKEND=redis://valkey:6379/0
      - FLOWER_URL=${FLOWER_URL:-}
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,django}
      # Centrifugo settings
      - CENTRIFUGO_URL=http://centrifugo:8000
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY:-}
      - CENTRIFUGO_TOKEN_SECRET=${CENTRIFUGO_TOKEN_SECRET:-}
      # Observability settings
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-django-ninja-app}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - USE_STRUCTURED_LOGGING=${USE_STRUCTURED_LOGGING:-false}
      # Python optimizations
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - dev
      - celery
      - huey
      - django-q
      - django-rq
      - dramatiq
    deploy:
      resources:
        limits:
          cpus: "2.0"
          # Laya, the default decision provider, loads its model in this
          # process. With the runserver reloader, 1G was OOM-killed on the
          # first decision. Lower it only if you disable decisions.
          memory: ${DJANGO_DEV_MEMORY_LIMIT:-4G}
        reservations:
          cpus: "0.5"
          memory: 256M

  # ===========================================
  # Centrifugo Real-Time Server (profile: realtime)
  # ===========================================

  centrifugo:
    image: centrifugo/centrifugo:v5
    command: centrifugo -c config.json
    volumes:
      - ./deploy/centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - "8800:8000"
    environment:
      # Centrifugo does NOT expand ${...} in its config file; it only reads
      # env vars whose names match its own config keys. So the hmac key must
      # be set as CENTRIFUGO_TOKEN_HMAC_SECRET_KEY, because Django signs JWTs
      # with settings.CENTRIFUGO_TOKEN_SECRET and both sides must agree.
      - CENTRIFUGO_TOKEN_HMAC_SECRET_KEY=${CENTRIFUGO_TOKEN_SECRET:-centrifugo-token-secret}
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY:-centrifugo-api-key}
      # Overrides redis_address from config.json. It must name a host that
      # resolves in this profile (valkey, not the single-profile redis).
      - CENTRIFUGO_REDIS_ADDRESS=redis://valkey:6379/1
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - realtime
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ===========================================
  # Celery Services (profile: celery)
  # Uses 'production' target for optimized performance
  # ===========================================

  # Celery Worker
  celery-worker:
    <<: *app-env
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: celery -A api worker -l info --concurrency=2 --max-tasks-per-child=100
    healthcheck:
      disable: true
    volumes:
      - .:/app
      - /app/.venv
    environment:
      # The dev stack's trace collector (`just up-monitoring`).
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      # Tasks run the same Django code and may call the CLM decision provider.
      - CLM_BASE_URL=${CLM_CONTAINER_URL:-http://clm-api:8700}
      - CLM_API_KEY=${CLM_API_KEY:-}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-api.settings}
      - DEBUG=${DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DB_NAME=${DB_NAME:-boilerplate_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - VALKEY_URL=valkey://valkey:6379/0
      - REDIS_URL=valkey://valkey:6379/0
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - CELERY_RESULT_BACKEND=redis://valkey:6379/0
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      django:
        condition: service_healthy
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - app-network
    # Celery is opt-in: `just up-celery` adds this profile to the dev stack.
    profiles:
      - celery
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # Celery Beat Scheduler
  celery-beat:
    <<: *app-env
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: celery -A api beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    healthcheck:
      disable: true
    volumes:
      - .:/app
      - /app/.venv
    environment:
      # The dev stack's trace collector (`just up-monitoring`).
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      # Tasks run the same Django code and may call the CLM decision provider.
      - CLM_BASE_URL=${CLM_CONTAINER_URL:-http://clm-api:8700}
      - CLM_API_KEY=${CLM_API_KEY:-}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-api.settings}
      - DEBUG=${DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DB_NAME=${DB_NAME:-boilerplate_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - VALKEY_URL=valkey://valkey:6379/0
      - REDIS_URL=valkey://valkey:6379/0
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - CELERY_RESULT_BACKEND=redis://valkey:6379/0
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      django:
        condition: service_healthy
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
      celery-worker:
        condition: service_started
    networks:
      - app-network
    # Celery is opt-in: `just up-celery` adds this profile to the dev stack.
    profiles:
      - celery
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # Huey Worker (profile: huey)
  huey-worker:
    <<: *app-env
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: python manage.py run_huey
    healthcheck:
      disable: true
    volumes:
      - .:/app
      - /app/.venv
    environment:
      # The dev stack's trace collector (`just up-monitoring`).
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      # Tasks run the same Django code and may call the CLM decision provider.
      - CLM_BASE_URL=${CLM_CONTAINER_URL:-http://clm-api:8700}
      - CLM_API_KEY=${CLM_API_KEY:-}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-api.settings}
      - DEBUG=${DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DB_NAME=${DB_NAME:-boilerplate_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - VALKEY_URL=valkey://valkey:6379/0
      - REDIS_URL=valkey://valkey:6379/0
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - CELERY_RESULT_BACKEND=redis://valkey:6379/0
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - TASK_BACKEND=huey
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      django:
        condition: service_healthy
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - huey
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # django-q2 Worker (profile: django-q)
  django-q-worker:
    <<: *app-env
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: python manage.py qcluster
    healthcheck:
      disable: true
    volumes:
      - .:/app
      - /app/.venv
    environment:
      # The dev stack's trace collector (`just up-monitoring`).
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      # Tasks run the same Django code and may call the CLM decision provider.
      - CLM_BASE_URL=${CLM_CONTAINER_URL:-http://clm-api:8700}
      - CLM_API_KEY=${CLM_API_KEY:-}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-api.settings}
      - DEBUG=${DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DB_NAME=${DB_NAME:-boilerplate_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - VALKEY_URL=valkey://valkey:6379/0
      - REDIS_URL=valkey://valkey:6379/0
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - CELERY_RESULT_BACKEND=redis://valkey:6379/0
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - TASK_BACKEND=django_q
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      django:
        condition: service_healthy
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - django-q
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # django-rq Worker (profile: django-rq)
  django-rq-worker:
    <<: *app-env
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: python manage.py rqworker default high low
    healthcheck:
      disable: true
    volumes:
      - .:/app
      - /app/.venv
    environment:
      # The dev stack's trace collector (`just up-monitoring`).
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      # Tasks run the same Django code and may call the CLM decision provider.
      - CLM_BASE_URL=${CLM_CONTAINER_URL:-http://clm-api:8700}
      - CLM_API_KEY=${CLM_API_KEY:-}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-api.settings}
      - DEBUG=${DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DB_NAME=${DB_NAME:-boilerplate_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - VALKEY_URL=valkey://valkey:6379/0
      - REDIS_URL=valkey://valkey:6379/0
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - CELERY_RESULT_BACKEND=redis://valkey:6379/0
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - TASK_BACKEND=django_rq
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      django:
        condition: service_healthy
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - django-rq
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # Dramatiq Worker (profile: dramatiq)
  dramatiq-worker:
    <<: *app-env
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: dramatiq api.tasks.dramatiq_worker --processes 1 --threads 4
    healthcheck:
      disable: true
    volumes:
      - .:/app
      - /app/.venv
    environment:
      # The dev stack's trace collector (`just up-monitoring`).
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      # Tasks run the same Django code and may call the CLM decision provider.
      - CLM_BASE_URL=${CLM_CONTAINER_URL:-http://clm-api:8700}
      - CLM_API_KEY=${CLM_API_KEY:-}
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-api.settings}
      - DEBUG=${DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DB_NAME=${DB_NAME:-boilerplate_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - VALKEY_URL=valkey://valkey:6379/0
      - REDIS_URL=redis://valkey:6379/0
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - CELERY_RESULT_BACKEND=redis://valkey:6379/0
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - TASK_BACKEND=dramatiq
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      django:
        condition: service_healthy
      db:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - dramatiq
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # ===========================================
  # Monitoring Services (profile: monitoring)
  # ===========================================

  # Jaeger - Distributed Tracing Backend
  # Access UI at http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.53
    ports:
      - "6831:6831/udp" # Jaeger thrift compact protocol
      - "6832:6832/udp" # Jaeger thrift binary protocol
      - "5778:5778" # Agent serve configs
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "14250:14250" # Jaeger gRPC collector
      - "14268:14268" # Jaeger HTTP collector
      - "14269:14269" # Admin port (health check)
      - "9411:9411" # Zipkin compatible endpoint
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=info
    networks:
      - app-network
    profiles:
      - observability
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # Flower - Celery Monitoring Dashboard
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: celery -A api flower --port=5555 --broker=redis://valkey:6379/0
    # The image healthcheck probes Django on 8000; Flower listens on 5555.
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5555"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - "5555:5555"
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-api.settings}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - REDIS_URL=redis://valkey:6379/0
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH:-admin:password}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      valkey:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ===========================================
  # Development-only tooling (profile: dev)
  # ===========================================

  # Django AI Boost MCP server (SSE). Needs the `dev` extra.
  mcp:
    <<: *app-env
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    # Optional: `just up-mcp`. Not part of the default stack.
    profiles:
      - mcp
    command: >
      sh -c "uv run django-ai-boost --settings api.settings.dev --transport sse --host 0.0.0.0 --port 8001"
    volumes:
      - .:/app
      - /app/.venv
    ports:
      # Loopback only: the MCP tools read the database and settings.
      - "127.0.0.1:8001:8001"
    environment:
      - DJANGO_SETTINGS_MODULE=api.settings.dev
      - PYTHONPATH=/app
      # Use the image virtualenv. Without this, `uv run` tries to create .venv
      # inside the bind mount, which the app user cannot write, and the
      # container exits.
      - UV_PROJECT_ENVIRONMENT=/opt/venv
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-boilerplate_db}
      # Settings read the DB_* variables, not DATABASE_URL, so pin them: .env
      # holds the host values.
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-boilerplate_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - VALKEY_URL=valkey://valkey:6379/0
      - REDIS_URL=valkey://valkey:6379/0
      - CELERY_BROKER_URL=redis://valkey:6379/0
      - CELERY_RESULT_BACKEND=redis://valkey:6379/0
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - ENABLE_DECISION_MCP=true
      # The dev stack's trace collector (`just up-monitoring`).
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      # The MCP evaluate_decision tool calls the configured decision provider.
      - CLM_BASE_URL=${CLM_CONTAINER_URL:-http://clm-api:8700}
      - CLM_API_KEY=${CLM_API_KEY:-}
      - DECISION_EMBEDDING_URL=${DECISION_EMBEDDING_CONTAINER_URL:-http://embedder:8080/v1/embeddings}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      # The image healthcheck probes port 8000; this server listens on 8001.
      # SSE holds the connection open, so probe the port instead of a path.
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8001"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Catches outgoing email in development.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    # Optional: `just up-mail`. Not part of the default stack.
    profiles:
      - mail
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - app-network

  # ===========================================
  # Production stack (profile: prod)
  # Renamed with a -prod suffix so it can coexist with the dev services.
  # ===========================================

  # PostgreSQL Database (production tuning, no port exposure)
  db-prod:
    image: pgvector/pgvector:pg17
    profiles:
      - prod
      - realtime-prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --data-checksums
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # Valkey Cache & Message Broker (password-protected)
  valkey-prod:
    image: valkey/valkey:8-alpine
    profiles:
      - prod
      - realtime-prod
    volumes:
      - valkey_data:/data
    command: >
      valkey-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-keepalive 300
      --timeout 0
    networks:
      - app-network
    healthcheck:
      test:
        [
          "CMD",
          "valkey-cli",
          "--no-auth-warning",
          "-a",
          "${REDIS_PASSWORD}",
          "ping",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  # Django Application Server (Gunicorn, production target)
  django-prod:
    <<: *app-env
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    profiles:
      - prod
    # Keep every line at one indent: in a folded scalar, deeper lines keep
    # their newlines, and `sh -c` then runs each gunicorn flag as a command.
    command: >
      sh -c "python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      gunicorn api.wsgi:application
      --bind 0.0.0.0:8000
      --workers ${GUNICORN_WORKERS:-4}
      --threads 2
      --worker-class gthread
      --worker-tmp-dir /dev/shm
      --timeout 120
      --keep-alive 5
      --max-requests 1000
      --max-requests-jitter 50
      --access-logfile -
      --error-logfile -
      --capture-output"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/logs
    expose:
      - "8000"
    environment:
      - DJANGO_SETTINGS_MODULE=api.settings.prod
      # ENVIRONMENT drives structured logging and the S3 storage branch in
      # api/settings/common.py. Without it the reused dev .env leaks
      # "development" into production.
      - ENVIRONMENT=production
      # JSON logging: .env carries the development value, so pin it here.
      - USE_STRUCTURED_LOGGING=true
      - DEBUG=0
      - SECRET_KEY=${SECRET_KEY}
      # api/settings/prod.py fails at startup when this is unset or equals
      # SECRET_KEY. A Compose `:?` guard here would block every profile,
      # including dev, because Compose interpolates all services.
      - NINJA_JWT_SIGNING_KEY=${NINJA_JWT_SIGNING_KEY:-}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db-prod
      - DB_PORT=5432
      - VALKEY_URL=valkey://:${REDIS_PASSWORD}@valkey-prod:6379/0
      - REDIS_URL=valkey://:${REDIS_PASSWORD}@valkey-prod:6379/0
      # kombu has no valkey transport, so the broker uses the redis:// scheme.
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@valkey-prod:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@valkey-prod:6379/0
      - FRONTEND_URL=${FRONTEND_URL}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS}
      # Bundled nginx listens on HTTP port 80 and sets X-Forwarded-Proto=http.
      # Enable TLS only when Django receives the original scheme from a trusted proxy.
      - USE_TLS=${USE_TLS:-false}
      - CLM_BASE_URL=${CLM_CONTAINER_URL:-http://clm-api:8700}
      - CLM_API_KEY=${CLM_API_KEY:-}
      - DECISION_EMBEDDING_URL=${DECISION_EMBEDDING_CONTAINER_URL:-http://embedder:8080/v1/embeddings}
      # Centrifugo settings
      - CENTRIFUGO_URL=${CENTRIFUGO_URL:-http://centrifugo-prod:8000}
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY}
      - CENTRIFUGO_TOKEN_SECRET=${CENTRIFUGO_TOKEN_SECRET}
      # Python production settings
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONOPTIMIZE=1
    depends_on:
      db-prod:
        condition: service_healthy
      valkey-prod:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: ${DJANGO_MEMORY_LIMIT:-2G}
        reservations:
          cpus: "1.0"
          memory: 512M
      replicas: 1

  # Celery Worker (production target)
  celery-worker-prod:
    <<: *app-env
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    profiles:
      - prod
    # No -Q: the worker consumes every queue in app.conf.task_queues
    # (default, emails, bulk), like the dev worker. `-Q default,celery` left
    # the routed cleanup and email tasks queued forever.
    command: >
      celery -A api worker
        -l info
        --concurrency=${CELERY_CONCURRENCY:-4}
        --max-tasks-per-child=1000
    # The image healthcheck probes Django on 8000, which a worker never serves.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A api inspect ping -d celery@$$HOSTNAME --timeout 10",
        ]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 30s
    volumes:
      - logs_volume:/app/logs
    environment:
      # Tasks run the same Django code and may call the CLM decision provider.
      - CLM_BASE_URL=${CLM_CONTAINER_URL:-http://clm-api:8700}
      - CLM_API_KEY=${CLM_API_KEY:-}
      - DJANGO_SETTINGS_MODULE=api.settings.prod
      # ENVIRONMENT drives structured logging and the S3 storage branch in
      # api/settings/common.py. Without it the reused dev .env leaks
      # "development" into production.
      - ENVIRONMENT=production
      # JSON logging: .env carries the development value, so pin it here.
      - USE_STRUCTURED_LOGGING=true
      - DEBUG=0
      - SECRET_KEY=${SECRET_KEY}
      - NINJA_JWT_SIGNING_KEY=${NINJA_JWT_SIGNING_KEY:-}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db-prod
      - DB_PORT=5432
      - VALKEY_URL=valkey://:${REDIS_PASSWORD}@valkey-prod:6379/0
      - REDIS_URL=valkey://:${REDIS_PASSWORD}@valkey-prod:6379/0
      # kombu has no valkey transport, so the broker uses the redis:// scheme.
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@valkey-prod:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@valkey-prod:6379/0
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      db-prod:
        condition: service_healthy
      valkey-prod:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  # Celery Beat Scheduler (production target)
  celery-beat-prod:
    <<: *app-env
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    profiles:
      - prod
    command: celery -A api beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    # Beat serves no port; the image healthcheck would probe Django on 8000.
    healthcheck:
      disable: true
    volumes:
      - logs_volume:/app/logs
    environment:
      # Tasks run the same Django code and may call the CLM decision provider.
      - CLM_BASE_URL=${CLM_CONTAINER_URL:-http://clm-api:8700}
      - CLM_API_KEY=${CLM_API_KEY:-}
      - DJANGO_SETTINGS_MODULE=api.settings.prod
      # ENVIRONMENT drives structured logging and the S3 storage branch in
      # api/settings/common.py. Without it the reused dev .env leaks
      # "development" into production.
      - ENVIRONMENT=production
      # JSON logging: .env carries the development value, so pin it here.
      - USE_STRUCTURED_LOGGING=true
      - DEBUG=0
      - SECRET_KEY=${SECRET_KEY}
      - NINJA_JWT_SIGNING_KEY=${NINJA_JWT_SIGNING_KEY:-}
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db-prod
      - DB_PORT=5432
      - VALKEY_URL=valkey://:${REDIS_PASSWORD}@valkey-prod:6379/0
      - REDIS_URL=valkey://:${REDIS_PASSWORD}@valkey-prod:6379/0
      # kombu has no valkey transport, so the broker uses the redis:// scheme.
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD}@valkey-prod:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD}@valkey-prod:6379/0
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      db-prod:
        condition: service_healthy
      valkey-prod:
        condition: service_healthy
      celery-worker-prod:
        condition: service_started
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # Centrifugo Real-Time Server (profile: realtime, production)
  centrifugo-prod:
    image: centrifugo/centrifugo:v5
    profiles:
      - realtime-prod
    command: centrifugo -c config.json
    volumes:
      - ./deploy/centrifugo/config.json:/centrifugo/config.json:ro
    expose:
      - "8000"
    environment:
      # Must match the secret Django signs with; see the dev service above.
      # Required: an empty hmac key would silently reject every client token
      # while Django keeps signing with its own default.
      - CENTRIFUGO_TOKEN_HMAC_SECRET_KEY=${CENTRIFUGO_TOKEN_SECRET:?CENTRIFUGO_TOKEN_SECRET must be set for realtime}
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY}
      - CENTRIFUGO_ADMIN=false
      # Browser origins allowed to open a WebSocket, space separated. The
      # config file lists only the dev origins, so without this Centrifugo
      # rejects every production browser connection with 403.
      - CENTRIFUGO_ALLOWED_ORIGINS=${CENTRIFUGO_ALLOWED_ORIGINS:-http://localhost}
      - CENTRIFUGO_REDIS_ADDRESS=redis://:${REDIS_PASSWORD}@valkey-prod:6379/1
    depends_on:
      valkey-prod:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # Nginx Reverse Proxy
  nginx:
    build: ./nginx
    profiles:
      - prod
    ports:
      - "80:80"
    volumes:
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    depends_on:
      - django-prod
    networks:
      - app-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================
  # Single-container stack (profile: single)
  # For PaaS platforms that run one container per service.
  # ===========================================

  # PostgreSQL Database (single-container stack)
  db-single:
    image: pgvector/pgvector:pg17
    profiles:
      - single
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=${DB_NAME:-boilerplate_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  # Redis (single-container stack)
  redis:
    image: redis:7.2-alpine
    profiles:
      - single
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - app-network

  # Django Application (single container)
  app:
    <<: *app-env
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.single
    profiles:
      - single
    environment:
      # Pinned: .env carries the development values (api.settings,
      # ENVIRONMENT=development, DEBUG=1) and would otherwise override the
      # production defaults baked into the image.
      - DJANGO_SETTINGS_MODULE=api.settings.prod
      - ENVIRONMENT=production
      # JSON logging: .env carries the development value, so pin it here.
      - USE_STRUCTURED_LOGGING=true
      - USE_TLS=${USE_TLS:-false}
      - CLM_BASE_URL=${CLM_CONTAINER_URL:-http://clm-api:8700}
      - CLM_API_KEY=${CLM_API_KEY:-}
      - DECISION_EMBEDDING_URL=${DECISION_EMBEDDING_CONTAINER_URL:-http://embedder:8080/v1/embeddings}
      - DEBUG=0
      - SECRET_KEY=${SECRET_KEY}
      - NINJA_JWT_SIGNING_KEY=${NINJA_JWT_SIGNING_KEY:-}
      - DB_NAME=${DB_NAME:-boilerplate_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=db-single
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      # Settings read VALKEY_URL first, so pin it: the `single` stack has no
      # `valkey` service, and .env names one.
      - VALKEY_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1}
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      db-single:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # Optional GPU-backed open-source System One engine. Start this profile only
  # on a Linux host with the NVIDIA Container Toolkit and enough GPU memory
  # for Qwen3-8B. vLLM downloads its weights into the persistent cache.
  clm-encoder:
    image: vllm/vllm-openai:v0.11.2
    platform: linux/amd64
    profiles:
      - decisions-clm
    command:
      - Qwen/Qwen3-8B
      - --served-model-name
      - qwen3-8b
      - --runner
      - pooling
      - --max-model-len
      - "2048"
      - --port
      - "8090"
    environment:
      - HF_HOME=/root/.cache/huggingface
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - clm_hf_cache:/root/.cache/huggingface
    expose:
      - "8090"
    # The vLLM image ships `python3` only; a `python` probe never passes, and
    # clm-api waits on this service being healthy.
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 10m
    networks:
      - app-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  clm-api:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.clm
    platform: linux/amd64
    # decisions-clm runs the GPU encoder above. decisions-clm-host runs only
    # this API and uses CLM_ENCODER_URL, for example llama.cpp on an Apple
    # Silicon host (`just clm-encoder-local`) or a remote vLLM server.
    profiles:
      - decisions-clm
      - decisions-clm-host
    environment:
      - CLM_API_KEY=${CLM_API_KEY:-}
      - CLM_EMB_URL=${CLM_ENCODER_URL:-http://clm-encoder:8090/v1/embeddings}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - clm_head_cache:/root/.cache/clm
    ports:
      - "127.0.0.1:${CLM_PORT:-8700}:8700"
    depends_on:
      clm-encoder:
        condition: service_healthy
        # Skipped under decisions-clm-host, where clm-encoder is not enabled.
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import json,urllib.request; assert json.load(urllib.request.urlopen('http://127.0.0.1:8700/health', timeout=5))['embedder']",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5m
    networks:
      - app-network

  # Qwen3-Embedding-0.6B for decision fixture similarity search. CPU is
  # enough for this 0.6B model; the first start downloads the ~640 MB GGUF
  # into a named volume. Add it with `--profile embeddings` (or
  # `just up-embeddings`); it joins any stack, dev or prod.
  embedder:
    image: ghcr.io/ggml-org/llama.cpp:server-b11223
    profiles:
      - embeddings
    command:
      - -hf
      - Qwen/Qwen3-Embedding-0.6B-GGUF:Q8_0
      - --embeddings
      - --pooling
      - last
      - --ctx-size
      - "8192"
      - --ubatch-size
      - "8192"
      - --batch-size
      - "8192"
      - --alias
      - qwen3-embedding-0.6b
      - --host
      - 0.0.0.0
      - --port
      - "8080"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - embedder_cache:/root/.cache/llama.cpp
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 5m
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500

volumes:
  postgres_data:
    driver: local
  postgres_dev_data:
    driver: local
  valkey_data:
    driver: local
  valkey_dev_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
  logs_volume:
    driver: local
  redis_data:
    driver: local
  clm_hf_cache:
    driver: local
  clm_head_cache:
    driver: local
  embedder_cache:
    driver: local
