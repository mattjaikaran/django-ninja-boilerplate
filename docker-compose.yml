# Django Ninja Boilerplate - Docker Compose Configuration
# Optimized for OrbStack and resource efficiency
#
# This configuration uses the unified multi-stage Dockerfile:
#   - Django service uses 'development' target for hot reload and debug tools
#   - Celery services use 'production' target for optimized performance
#
# Usage:
#   make up           - Start default services (db, redis, django)
#   make up-celery    - Start with Celery workers
#   make up-monitoring - Start with monitoring (Flower)
#   make up-full      - Start all services

services:
  # ===========================================
  # Core Services (always started)
  # ===========================================

  # PostgreSQL 17 Database
  db:
    image: postgres:17-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./docker/postgres/dumps:/dumps
    environment:
      - POSTGRES_DB=${DB_NAME:-boilerplate_db}
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      # Performance tuning for development
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # Redis for caching and sessions
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # Django Web Application with Hot Reloading
  # Uses 'development' target for dev dependencies, debug tools, and hot reload
  django:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    entrypoint: ["/usr/local/bin/docker-entrypoint-dev.sh"]
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      # Exclude directories that don't need syncing for better performance
      - /app/.venv
      - /app/__pycache__
      - /app/.pytest_cache
      - /app/.ruff_cache
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-api.settings}
      - DEBUG=${DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DB_NAME=${DB_NAME:-boilerplate_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-localhost,127.0.0.1,0.0.0.0,django}
      # Centrifugo settings
      - CENTRIFUGO_URL=${CENTRIFUGO_URL:-http://centrifugo:8000}
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY:-}
      - CENTRIFUGO_TOKEN_SECRET=${CENTRIFUGO_TOKEN_SECRET:-}
      # Observability settings
      - OTEL_SERVICE_NAME=${OTEL_SERVICE_NAME:-django-ninja-app}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4317}
      - USE_STRUCTURED_LOGGING=${USE_STRUCTURED_LOGGING:-false}
      # Python optimizations
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  # ===========================================
  # Centrifugo Real-Time Server (profile: realtime)
  # ===========================================

  centrifugo:
    image: centrifugo/centrifugo:v5
    command: centrifugo -c config.json
    volumes:
      - ./deploy/centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - "8800:8000"
    environment:
      - CENTRIFUGO_TOKEN_SECRET=${CENTRIFUGO_TOKEN_SECRET:-centrifugo-token-secret}
      - CENTRIFUGO_API_KEY=${CENTRIFUGO_API_KEY:-centrifugo-api-key}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - realtime
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ===========================================
  # Celery Services (profile: celery)
  # Uses 'production' target for optimized performance
  # ===========================================

  # Celery Worker
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: celery -A api worker -l info --concurrency=2 --max-tasks-per-child=100
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-api.settings}
      - DEBUG=${DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DB_NAME=${DB_NAME:-boilerplate_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - celery
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # Celery Beat Scheduler
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: celery -A api beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
      - /app/.venv
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-api.settings}
      - DEBUG=${DEBUG:-1}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - DB_NAME=${DB_NAME:-boilerplate_db}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-postgres}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      celery-worker:
        condition: service_started
    networks:
      - app-network
    profiles:
      - celery
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ===========================================
  # Monitoring Services (profile: monitoring)
  # ===========================================

  # Jaeger - Distributed Tracing Backend
  # Access UI at http://localhost:16686
  jaeger:
    image: jaegertracing/all-in-one:1.53
    ports:
      - "6831:6831/udp" # Jaeger thrift compact protocol
      - "6832:6832/udp" # Jaeger thrift binary protocol
      - "5778:5778" # Agent serve configs
      - "16686:16686" # Jaeger UI
      - "4317:4317" # OTLP gRPC receiver
      - "4318:4318" # OTLP HTTP receiver
      - "14250:14250" # Jaeger gRPC collector
      - "14268:14268" # Jaeger HTTP collector
      - "14269:14269" # Admin port (health check)
      - "9411:9411" # Zipkin compatible endpoint
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - LOG_LEVEL=info
    networks:
      - app-network
    profiles:
      - observability
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:14269/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  # Flower - Celery Monitoring Dashboard
  flower:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: celery -A api flower --port=5555 --broker=${REDIS_URL:-redis://redis:6379/0}
    ports:
      - "5555:5555"
    environment:
      - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-api.settings}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - FLOWER_BASIC_AUTH=${FLOWER_BASIC_AUTH:?FLOWER_BASIC_AUTH must be set (user:password)}
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - monitoring
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

networks:
  app-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1500

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local
